[Definition]
failregex = limiting requests, excess:.* by zone.*client: <HOST>
# Zones suffixées _recherche : limite par IP sans ban. Elles protègent la recherche des sites (émission de
# jetons, rendu des pages), souvent atteinte derrière des IP partagées (iCloud Private Relay, Cloudflare
# WARP, réseaux d'établissement) qu'un ban couperait pour tous leurs utilisateurs. Le 429 suffit.
ignoreregex = by zone "[a-z0-9_]+_recherche"
