[Definition]
# Ancré sur le début de ligne : request et referrer sont écrits tels quels par nginx et pourraient sinon
# désigner une autre IP ou une autre zone.
failregex = ^\s*\[\w+\] \d+#\d+: \*\d+ limiting requests, excess: [\d.]+ by zone "[^"]+", client: <HOST>,
# Zones suffixées _recherche : limite par IP sans ban. Elles protègent la recherche des sites (émission de
# jetons, rendu des pages), souvent atteinte derrière des IP partagées (iCloud Private Relay, Cloudflare
# WARP, réseaux d'établissement) qu'un ban couperait pour tous leurs utilisateurs. Le 429 suffit.
ignoreregex = ^\s*\[\w+\] \d+#\d+: \*\d+ limiting requests, excess: [\d.]+ by zone "[a-z0-9_]+_recherche", client:
# Zone flood : limite globale du reverse proxy, atteinte par des navigateurs sur les fichiers statiques et les
# préchargements de pages. Le 503 suffit.
              ^\s*\[\w+\] \d+#\d+: \*\d+ limiting requests, excess: [\d.]+ by zone "flood", client:
