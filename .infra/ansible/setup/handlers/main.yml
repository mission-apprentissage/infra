- name: restart-ssh
  service:
    name: ssh
    state: restarted

- name: restart-fail2ban
  service:
    name: fail2ban
    enabled: true
    state: restarted

- name: restart-logrotate
  service:
    name: logrotate
    enabled: true
    state: restarted

- name: restart-nftables
  service:
    name: nftables
    enabled: true
    state: restarted

- name: Redémarrage de containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
  listen: containerd config changed

- name: Redémarrage de Docker après containerd
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  listen: containerd config changed

