- include_role:
    name: geerlingguy.docker
  vars:
    docker_daemon_options:
      ipv6: false
      ip6tables: false
      dns: ["172.17.0.1"]
      log-driver: fluentd
      log-opts:
        fluentd-address: localhost:24224
        tag: docker.txt.{{product_name}}.{{env_type}}.{{ '{{' }}.Name{{ '}}' }}_run
        fluentd-async: "true"
  when: env_type != 'preview' and gpu_instance == False

- include_role:
    name: geerlingguy.docker
  vars:
    docker_daemon_options:
      ipv6: false
      ip6tables: false
      dns: ["172.17.0.1"]
      log-driver: local
  when: env_type == 'preview' and gpu_instance == False

- include_role:
    name: geerlingguy.docker
  vars:
    docker_daemon_options:
      ipv6: false
      ip6tables: false
      dns: ["172.17.0.1"]
      log-driver: fluentd
      log-opts:
        fluentd-address: localhost:24224
        tag: docker.txt.{{product_name}}.{{env_type}}.{{ '{{' }}.Name{{ '}}' }}_run
        fluentd-async: "true"
      runtimes:
        nvidia:
          path: "nvidia-container-runtime"
          runtimeArgs: []
      default-runtime: "nvidia"
      node-generic-resources: ["gpu={{ gpu_uuid }}"]
  when: gpu_instance == True

- name: Docker login
  shell: "echo $PASS | docker login -u '{{ DOCKER_LOGIN.user }}' --password-stdin"
  environment: 
    PASS: "{{ DOCKER_LOGIN.token }}"

- name: récupération du status de docker swarm
  ansible.builtin.shell: docker info --format={% raw %}'{{.Swarm.LocalNodeState}}'{% endraw %}
  register: docker_swarm_status
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']

- name: initialisation de docker swarm
  ansible.builtin.shell: docker swarm init --advertise-addr "{{ ansible_default_ipv4.address }}"
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']
    - docker_swarm_status.stdout.find('inactive') != -1
    - private = False

- name: initialisation de docker swarm
  ansible.builtin.shell: docker swarm init --advertise-addr "{{ private_ip }}"
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']
    - docker_swarm_status.stdout.find('inactive') != -1
    - private = True

- name: check du docker network
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: docker network ls --filter name={{ docker_network }} -q
  register: network
  when: product_name != 'runner'

- debug:
    var: network
  when: product_name != 'runner'

- name: création du docker network en swarm mode
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: docker network create -d overlay --attachable {{ docker_network }}
  when:
    - product_name != 'runner'
    - network.stdout == ""
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']

- name: Vérification des réseaux Docker du serveur 'runner'
  ansible.builtin.command:
    cmd: docker network inspect {{ item.name }}
  loop:
    - { name: "{{ docker_network }}", attachable: true }
    - { name: runner_network, attachable: false }
  loop_control:
    label: "{{ item.name }}"
  register: runner_networks
  changed_when: false
  failed_when: runner_networks.rc not in [0, 1]
  when: product_name == 'runner'

- name: Création des réseaux Docker du serveur 'runner'
  ansible.builtin.command:
    cmd: >-
      docker network create -d overlay
      {{ '--attachable' if item.item.attachable else '' }}
      {{ item.item.name }}
  loop: "{{ runner_networks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - product_name == 'runner'
    - item.rc | default(0) != 0

- name: Création du réseau Docker en mode Compose
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: >-
      docker network inspect {{ docker_network }} > /dev/null 2>&1
      && echo exists
      || docker network create --attachable {{ docker_network }}
  register: compose_network
  changed_when: "'exists' not in compose_network.stdout"
  when:
    - env_type == 'preview' or product_name in ['monitoring', 'sentry', 'data']

- shell: "docker node ls --format '{{ '{{' }} .ID {{ '}}' }}'"
  register: node_id
  when: gpu_instance == True

- set_fact:
    node_id={{ node_id.stdout }}  
  when: gpu_instance == True

- name: Ajout d'un label au nœud Docker Swarm
  shell: docker node update --label-add nvidia=true {{ node_id }}
  when: gpu_instance == True
