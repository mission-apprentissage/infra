- include_role:
    name: geerlingguy.docker
  vars:
    docker_daemon_options:
      ipv6: false
      ip6tables: false
      dns: ["172.17.0.1"]
      log-driver: fluentd
      log-opts:
        fluentd-address: localhost:24224
        tag: docker.txt.{{product_name}}.{{env_type}}.{{ '{{' }}.Name{{ '}}' }}_run
        fluentd-async: "true"
  when: gpu_instance == False

- include_role:
    name: geerlingguy.docker
  vars:
    docker_daemon_options:
      ipv6: false
      ip6tables: false
      dns: ["172.17.0.1"]
      log-driver: fluentd
      log-opts:
        fluentd-address: localhost:24224
        tag: docker.txt.{{product_name}}.{{env_type}}.{{ '{{' }}.Name{{ '}}' }}_run
        fluentd-async: "true"
      runtimes:
        nvidia:
          path: "nvidia-container-runtime"
          runtimeArgs: []
      default-runtime: "nvidia"
      node-generic-resources: ["gpu={{ gpu_uuid }}"]
  when: gpu_instance == True

- name: Vérification du montage du disque dédié à Docker
  ansible.builtin.assert:
    that:
      - ansible_facts.mounts | selectattr('mount', 'equalto', '/var/lib/docker') | list | length == 1
    fail_msg: >-
      docker_dedicated_disk est actif mais /var/lib/docker n'est pas un point de montage :
      containerd écrirait sur le disque système.
    quiet: true
  when: docker_dedicated_disk == True

- name: Création de la racine containerd sur le disque dédié
  ansible.builtin.file:
    path: "/var/lib/docker/containerd"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: docker_dedicated_disk == True

- name: Configuration de containerd (racine sur le disque dédié)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../files/containerd/config.toml.jinja2"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: containerd config changed
  when: docker_dedicated_disk == True

- name: Application immédiate de la configuration containerd
  ansible.builtin.meta: flush_handlers

- name: Docker login
  shell: "echo $PASS | docker login -u '{{ DOCKER_LOGIN.user }}' --password-stdin"
  environment: 
    PASS: "{{ DOCKER_LOGIN.token }}"

- name: Adresse d'annonce de docker swarm
  ansible.builtin.set_fact:
    swarm_advertise_addr: "{{ private_ip if private | bool else ansible_default_ipv4.address }}"
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']

- name: récupération du status de docker swarm
  ansible.builtin.shell: docker info --format={% raw %}'{{.Swarm.LocalNodeState}}'{% endraw %}
  register: docker_swarm_status
  changed_when: false
  check_mode: false
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']

# La sortie standard contient le jeton d'adhesion : elle n'est pas conservee.
# Le pool overlay par defaut (10.0.0.0/8) recouvre le plan d'adressage
# 10.20.0.0/16 : il n'est fixe qu'a l'initialisation.
- name: initialisation de docker swarm
  ansible.builtin.shell: >-
    docker swarm init
    --advertise-addr "{{ swarm_advertise_addr }}"
    --listen-addr "{{ swarm_advertise_addr }}:2377"
    --default-addr-pool "{{ swarm_default_addr_pool }}"
    --default-addr-pool-mask-length "{{ swarm_default_addr_pool_mask_length }}"
    > /dev/null
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']
    - docker_swarm_status.stdout.find('inactive') != -1

- name: Lecture du pool overlay et de l'adresse Raft de docker swarm
  ansible.builtin.shell: >-
    docker info --format '{% raw %}{{json .Swarm.Cluster.DefaultAddrPool}}{% endraw %}'
    && docker node inspect self --format '{% raw %}{{.ManagerStatus.Addr}}{% endraw %}'
  register: docker_swarm_cluster
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']
    - docker_swarm_status.stdout.find('active') == 0

# Avertissement seulement : une grappe existante ne se corrige que par sa
# recreation (leave, init, reseau, system:setup puis app:deploy).
- name: Avertissement si la grappe docker swarm est à recréer
  ansible.builtin.debug:
    msg: >-
      ATTENTION grappe Swarm a recreer : pool overlay {{ docker_swarm_cluster.stdout_lines[0] }}
      (attendu ["{{ swarm_default_addr_pool }}"]), adresse Raft {{ docker_swarm_cluster.stdout_lines[1] }}
      (attendue {{ swarm_advertise_addr }}:2377)
  when:
    - docker_swarm_cluster is not skipped
    - docker_swarm_cluster.stdout_lines | length == 2
    - >-
      docker_swarm_cluster.stdout_lines[0] != ('["' ~ swarm_default_addr_pool ~ '"]')
      or docker_swarm_cluster.stdout_lines[1] != (swarm_advertise_addr ~ ':2377')

- name: check du docker network
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: docker network ls --filter name={{ docker_network }} -q
  register: network
  when: product_name != 'runner'

- debug:
    var: network
  when: product_name != 'runner'

- name: création du docker network en swarm mode
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: docker network create -d overlay --attachable {{ docker_network }}
  when:
    - product_name != 'runner'
    - network.stdout == ""
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']

- name: Vérification des réseaux Docker du serveur 'runner'
  ansible.builtin.command:
    cmd: docker network inspect {{ item.name }}
  loop:
    - { name: "{{ docker_network }}", attachable: true }
    - { name: runner_network, attachable: false }
  loop_control:
    label: "{{ item.name }}"
  register: runner_networks
  changed_when: false
  failed_when: runner_networks.rc not in [0, 1]
  when: product_name == 'runner'

- name: Création des réseaux Docker du serveur 'runner'
  ansible.builtin.command:
    cmd: >-
      docker network create -d overlay
      {{ '--attachable' if item.item.attachable else '' }}
      {{ item.item.name }}
  loop: "{{ runner_networks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - product_name == 'runner'
    - item.rc | default(0) != 0

- name: Création du réseau Docker en mode Compose
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: >-
      docker network inspect {{ docker_network }} > /dev/null 2>&1
      && echo exists
      || docker network create --attachable {{ docker_network }}
  register: compose_network
  changed_when: "'exists' not in compose_network.stdout"
  when:
    - env_type == 'preview' or product_name in ['monitoring', 'sentry', 'data']

- shell: "docker node ls --format '{{ '{{' }} .ID {{ '}}' }}'"
  register: node_id
  when: gpu_instance == True

- set_fact:
    node_id={{ node_id.stdout }}  
  when: gpu_instance == True

- name: Ajout d'un label au nœud Docker Swarm
  shell: docker node update --label-add nvidia=true {{ node_id }}
  when: gpu_instance == True
