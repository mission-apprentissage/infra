- name: Création du fichier /opt/app/system/nginx/error.log # Requis pour la config fail2ban
  file:
    path: /opt/app/system/nginx/error.log
    group: adm
    owner: 101 # 101 is the user id of the nginx user
    state: touch

- name: Mise à jour des permissions /opt/app/system/nginx
  file:
    path: /opt/app/system/nginx
    group: adm
    owner: 101 # 101 is the user id of the nginx user
    mode: "u=rwX,g=rX,o=rX"
    recurse: yes

- name: Mise à jour des permissions /opt/app/system/fluentd
  file:
    path: /opt/app/system/fluentd
    group: adm
    owner: root
    mode: "u=rwX,g=rwX,o=rX"
    recurse: yes

- name: Nettoyage des permissions sudo pour le groupe '{{user_group}}'
  lineinfile:
    path: /etc/sudoers
    state: absent
    regexp: "{{user_group}}"

- name: Copie du fichier docker-compose.system.yml
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/opt/app/docker-compose.system.yml"
  with_fileglob:
    - "{{playbook_dir}}/../files/app/docker-compose.system.yml.jinja2"

# Les certificats livrés par pki ne sont installés pour nginx que par le hook
# (/opt/app/x509-hooks/hook <fqdn>). Si un fichier manque, nginx ne démarre pas,
# Swarm revient à l'ancien spec, qui échoue aussi (montages partagés) : reverse
# proxy à 0/0 (tdb-preprod le 24/11, api-recette et lba-recette le 26/11).
- name: Liste des certificats attendus par le reverse proxy
  ansible.builtin.set_fact:
    reverse_proxy_certificates: >-
      {{
        ([host_dns_name] if host_dns_name is defined else [])
        + ([dns_name] if not (certbot | default(true) | bool) and dns_name is defined
           and env_type != 'preview' else [])
      }}
  # Tous les hôtes : Swarm, Compose (monitoring, sentry, data) et preview, qui
  # monte le même répertoire ssl/ sur /etc/nginx/certs/ pour son vhost 9443.
  # Sur la preview, le wildcard public suit la convention nginx-proxy
  # (ssl/<domaine>.crt/.key, facultatif au démarrage) : dns_name non contrôlé.

- name: Contrôle des certificats du reverse proxy
  ansible.builtin.stat:
    path: "/opt/app/configs/reverse_proxy/ssl/{{ item.0 }}/{{ item.1 }}"
  loop: "{{ reverse_proxy_certificates | product(['fullchain.pem', 'privkey.pem']) | list }}"
  register: reverse_proxy_certificates_stat

- name: Arrêt si un certificat du reverse proxy manque
  ansible.builtin.fail:
    msg: >-
      /opt/app/configs/reverse_proxy/ssl/{{ item.item.0 }}/{{ item.item.1 }} absent ou vide.
      Lancer « sudo -u pki-x509-api sudo /opt/app/x509-hooks/hook {{ item.item.0 }} »
      pour chaque FQDN, puis relancer le setup. Les services systèmes n'ont pas été redéployés.
  loop: "{{ reverse_proxy_certificates_stat.results }}"
  loop_control:
    label: "{{ item.item.0 }}/{{ item.item.1 }}"
  when: not (item.stat.exists and item.stat.size > 0)

- name: Démarrage des services systèmes Docker Swarm
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: docker stack deploy --detach=false -c /opt/app/docker-compose.system.yml {{ product_name }}
  async: 1800
  poll: 10
  when:
    - env_type != 'preview'
    - product_name not in ['monitoring', 'sentry', 'data']

- name: Démarrage des services systèmes Docker Compose
  ansible.builtin.shell:
    chdir: /opt/app
    cmd: docker compose -f /opt/app/docker-compose.system.yml up -d --wait
  async: 1800
  poll: 10
  when:
    - product_name in ['monitoring', 'sentry', 'data'] or env_type == 'preview'

- name: Root only pour tous les répertoires applicatifs
  file:
    path: "/opt/app"
    state: directory
    owner: root
    group: root
    mode: "0770"

- name: Install htpasswd
  apt:
    name: [apache2-utils]

- name: Create monitoring access file
  shell: htpasswd -bBc "/opt/app/configs/reverse_proxy/locations/monitoring.htpasswd" monitoring {{ MONITORING_PASSWORD }}
