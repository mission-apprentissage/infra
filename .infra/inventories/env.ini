[all:vars]
reverse_proxy_version=1.7.11
fluentd_version=1.7.1
# 1MB=1024*1024^2
# Nginx default is 1MB
modsec_body_limit=1048576
modsec_rule_engine=On
#modsec_rule_engine=DetectionOnly
disallow_robots=True
add_kernel_modification=True
gpu_instance=False
certbot=True
private=False
manual_nftables=False
docker_dedicated_disk=False

user_group=mna
docker_network=mna_network
# Pool des reseaux overlay Swarm, applique a l'initialisation de la grappe
# (le defaut 10.0.0.0/8 recouvre 10.20.0.0/16)
swarm_default_addr_pool=172.24.0.0/14
swarm_default_addr_pool_mask_length=24
email_gpg_key=misson.apprentissage.devops@gmail.com
github_organization=mission-apprentissage
