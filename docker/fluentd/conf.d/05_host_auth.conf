# Keeps track of authorization systems, such as password prompts, the sudo command and remote logins.
# rsyslog écrit au format RFC 3339 haute precision
# (ex. 2026-09-28T23:56:59.491973+02:00 host sshd[1234]: message) :
# le parser "syslog" (format traditionnel "Sep 28 23:56:59") rejetait chaque ligne.
<source>
  @type tail
  path /var/log/host/auth.log
  pos_file /pos_file/auth.log.pos
  tag "docker.txt.#{ENV['PRODUCT_NAME']}.#{ENV['ENV_TYPE']}.host_auth"
  <parse>
    @type regexp
    expression /^(?<time>\S+) (?<host>\S+) (?<ident>[^\[:\s]*)(?:\[(?<pid>\d+)\])?: (?<message>.*)$/
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>
