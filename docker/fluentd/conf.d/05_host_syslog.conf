# syslog et kern.log : rsyslog écrit au format RFC 3339 haute precision,
# cf. 05_host_auth.conf.
<source>
  @type tail
  path /var/log/host/syslog
  pos_file /pos_file/syslog.log.pos
  tag "docker.txt.#{ENV['PRODUCT_NAME']}.#{ENV['ENV_TYPE']}.host_syslog"
  <parse>
    @type regexp
    expression /^(?<time>\S+) (?<host>\S+) (?<ident>[^\[:\s]+)(?:\[(?<pid>\d+)\])?: (?<message>.*)$/
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>
