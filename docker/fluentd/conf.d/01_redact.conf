# Masquage des paramètres d'URL sensibles dans le champ brut "log" AVANT tout
# parsing et toute expédition (Loki, S3).
#
# Cas constaté : /formulaire-intention?...&token=<JWT> apparaît dans $request
# et $http_referer côté Nginx (access log, et error.log qui porte le même tag),
# et dans req.url / req.headers.referer des logs JSON du serveur applicatif. Le payload du JWT (base64, non chiffré) contient
# des données personnelles (email, SIRET). Avec la rétention Loki, ces données
# resteraient lisibles en clair.
#
# Pourquoi record_modifier plutôt que record_transformer :
#   - la regex est compilée une fois à la configuration (pas d'eval Ruby par ligne) ;
#   - un enregistrement sans clé "log" (ex. audit ModSecurity, parsé dès la
#     source) est ignoré au lieu de recevoir une clé "log" vide.
#
# Placé avant 03_nginx.conf et 50_parse_json.conf (inclusion triée par nom) :
# les champs dérivés (nginx_path, nginx_referer, nginx_message, log_req...)
# héritent du masquage.
#
# Règle (insensible à la casse) : la valeur est remplacée par [redacted] pour
# tout paramètre, introduit par "?" ou "&", dont le nom
#   - se termine par token, secret, password, passwd, api_key, api-key ou apikey
#     (token, access_token, refresh_token, id_token, csrf_token, client_secret, apiKey...) ;
#   - ou vaut exactement jwt ou email.
# Le match est par suffixe : un paramètre "utm_token" serait masqué aussi.
# utm_source, utm_medium, utm_campaign... et les valeurs (q=token) restent intacts.
#
# Limite connue : un paramètre URL-encodé dans un autre paramètre
# (redirect=%2Fpage%3Ftoken%3D...) n'est pas masqué.
<filter docker.**>
  @type record_modifier
  <replace>
    key log
    expression /(?i)([?&](?:[^&=\s"?]*(?:token|secret|password|passwd|api[-_]?key)|jwt|email)=)[^&\s"\\]*/
    replace \1[redacted]
  </replace>
</filter>
