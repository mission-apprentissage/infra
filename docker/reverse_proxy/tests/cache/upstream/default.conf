# Amont factice : rejoue les en-têtes de réponse mesurés sur la prod LBA le 2026-09-01.
# Le corps servi est /srv/build.txt, modifiable à chaud pour simuler un nouveau build.
server {
    listen 80;

    # Document Next prérendu — le cas de l'incident (s-maxage 1 an)
    location = /doc {
        default_type text/html;
        add_header Cache-Control "s-maxage=31536000" always;
        add_header X-Nextjs-Cache "HIT" always;
        add_header X-Nextjs-Prerender "1" always;
        rewrite ^ /build.txt break;
        root /srv;
    }
    # Document Next PPR (Next envoie déjà no-store)
    location = /doc-ppr {
        default_type text/html;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
        add_header X-Nextjs-Prerender "1" always;
        rewrite ^ /build.txt break;
        root /srv;
    }
    # Asset immuable /_next/static/** — aucun en-tête x-nextjs
    location /_next/static/ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        rewrite ^ /build.txt break;
        root /srv;
    }
    # Réponse d'API sans Cache-Control (comportement mesuré sur /api/**)
    location /api/ {
        default_type application/json;
        rewrite ^ /build.txt break;
        root /srv;
    }
    # Réponse d'API demandant explicitement à être cachée
    location /api-public/ {
        default_type application/json;
        add_header Cache-Control "public, s-maxage=600" always;
        rewrite ^ /build.txt break;
        root /srv;
    }
}
