; Complete le pool [www] de l'image de base (www.conf, zz-docker.conf :
; ecoute sur 9000, journaux sur la sortie standard).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500

; Rapports lourds (segments, exports) ; l'archivage lui-meme est en CLI
request_terminate_timeout = 300

catch_workers_output = yes
decorate_workers_output = no
