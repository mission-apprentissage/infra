name: Run Setup
on:
  workflow_call:
    inputs:
      product:
        description: The product
        type: string
        required: true
      environment:
        description: The environment to setup
        type: string
        required: true
      SSH_KNOWN_HOSTS:
        description: The product SSH_KNOWN_HOSTS
        type: string
        required: true
    secrets:
      DEPLOY_SSH_PRIVATE_KEY:
        description: SSH private key
        required: true
      DEPLOY_PASS:
        description: SSH PWD TO DEPLOY
        required: true
      SLACK_WEBHOOK_ALERTS:
        description: Slack webhook URL
        required: true
      SLACK_WEBHOOK_NOTIF:
        description: Slack webhook URL
        required: true
      OVH_APP_TOKEN:
        description: OVH Application token
        required: true
      OVH_APP_KEY:
        description: OVH Application key
        required: true
      OVH_APP_SECRET:
        description: OVH Application secret
        required: true
      INFRA_OPENPGP_PRIVATE_SUBKEY:
        description: Github Actions' OpenPGP private subkey
        required: true
      PRODUCT_OPENPGP_PRIVATE_SUBKEY:
        description: Github Actions' OpenPGP private subkey
        required: true

jobs:

  # Diagnostic temporaire de l'import OpenPGP sur ubuntu-26.04 (Bad secret
  # key). Job indépendant : il ne bloque pas le setup, quel que soit son
  # résultat. N'affiche aucun matériel secret. A retirer après diagnostic.
  gpg-import-debug:
    name: Debug import GnuPG (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    permissions:
      contents: read
    env:
      INFRA_OPENPGP_KEY: ${{ secrets.INFRA_OPENPGP_PRIVATE_SUBKEY }}
      PRODUCT_OPENPGP_KEY: ${{ secrets.PRODUCT_OPENPGP_PRIVATE_SUBKEY }}
    steps:
      - name: Versions
        run: |
          echo "Image : ${ImageOS} ${ImageVersion}"
          dpkg-query -W -f='${Package} ${Version}\n' \
            gpg gpg-agent libgcrypt20 libgpg-error0 2>/dev/null || true

      # Import en --batch (IMPORT_KEY --unattended cote agent) : l agent
      # stocke la cle sans la deproteger, donc sans la verifier.
      - name: Import en --batch
        run: |
          for name in INFRA PRODUCT; do
            echo "=== ${name} ==="
            printenv "${name}_OPENPGP_KEY" | gpg --batch --import
          done

      - name: Cles importees (algorithme, capacites, format cote agent)
        if: always()
        run: |
          gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" || $1 == "ssb" { print $1, "algo=" $4, "bits=" $3, "keyid=" $5, "cap=" $12, "curve=" $17 }'
          gpg-connect-agent 'KEYINFO --list' /bye

      # Le vrai test : la cle est-elle utilisable ? Chiffrement puis
      # dechiffrement d un message de test pour chaque sous-cle de chiffrement.
      - name: Aller-retour chiffrement / dechiffrement
        if: always()
        run: |
          rc=0
          for fpr in $(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "ssb" && $12 ~ /e/ { getline; print $10 }'); do
            echo "=== ${fpr} ==="
            if echo "test-${fpr}" \
              | gpg --batch --trust-model always --encrypt --recipient "${fpr}!" \
              | gpg --batch --decrypt; then
              echo "OK"
            else
              echo "::error::Dechiffrement impossible avec ${fpr}"
              rc=1
            fi
          done
          exit "${rc}"

      - name: Nettoyage
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf ~/.gnupg

  npm-packages-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v6
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .bin/scripts/ovh/ovh-nodejs-client

      - name: Notify failure on Slack
        uses: slackapi/slack-github-action@v3
        if: failure()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "danger"
                fallback: "Setup ${{ inputs.product }}-${{ inputs.environment }} a échoué. Suspected traces of known attacks on the NPM supply chain!"
                title: "Setup ${{ inputs.product }}-${{ inputs.environment }} a échoué"
                title_link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                text: "<!channel> *[${{ inputs.product }}-${{ inputs.environment }}]* *${{ github.workflow }}* failed in <${{ github.server_url }}/${{ github.repository }}|${{ github.ref_name }}> on <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>. Suspected traces of known attacks on the NPM supply chain!"
                fields:
                  - title: "Branch"
                    value: "<${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}|${{ github.ref_name }}>"
                  - title: "Commit"
                    value: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"

  setup:
    if: ${{ success() }}
    needs: ["npm-packages-check"]
    concurrency:
      group: "${{ inputs.product }}-${{ inputs.environment }}-${{ github.workflow }}-${{ github.ref }}"
    name: Setup ${{ inputs.product }}-${{ inputs.environment }}
    runs-on: ubuntu-24.04
    steps:

      - name: Notify new deployment on Slack
        uses: slackapi/slack-github-action@v3
        if: always()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NOTIF }}
          webhook-type: incoming-webhook
          payload: |
            text: "Setup ${{ inputs.product }}-${{ inputs.environment }} initié..."
            attachments:
              - color: "#808080"
                fields:
                  - title: "Branch"
                    value: "<${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}|${{ github.ref_name }}>"
                  - title: "Commit"
                    value: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                footer: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"

      - name: Checkout project
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: cd .bin/scripts/ovh/ovh-nodejs-client; npm ci --ignore-scripts

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          name: github_actions
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known_hosts: ${{ inputs.SSH_KNOWN_HOSTS }}
          config: |
            Host *
              IdentityFile ~/.ssh/github_actions

      - name: Initialize the GnuPG keyring
        run: |
          echo -n "$INFRA_OPENPGP_KEY" | gpg --import
          echo -n "$PRODUCT_OPENPGP_KEY" | gpg --import
        env:
          INFRA_OPENPGP_KEY: ${{ secrets.INFRA_OPENPGP_PRIVATE_SUBKEY }}
          PRODUCT_OPENPGP_KEY: ${{ secrets.PRODUCT_OPENPGP_PRIVATE_SUBKEY }}

      - name: Setup SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64
          mv sops-v3.12.2.linux.amd64 /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Run playbook
        run: ".bin/infra system:setup ${{ inputs.product }} ${{ inputs.environment }}"
        env:
          ANSIBLE_REMOTE_USER: deploy
          ANSIBLE_BECOME_PASS: ${{ secrets.DEPLOY_PASS }}
          APP_TOKEN: ${{ secrets.OVH_APP_TOKEN }}
          APP_KEY: ${{ secrets.OVH_APP_KEY }}
          APP_SECRET: ${{ secrets.OVH_APP_SECRET }}

      - name: Encrypt logs
        run: .bin/infra app:deploy:log:encrypt
        if: always()

      - name: Upload logs artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ inputs.product }}-${{ inputs.environment }}
          path: /tmp/deploy.log.gpg

      - name: Add Job summary
        if: always()
        run: echo 'You can get logs using `.bin/infra app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.product }}-${{ inputs.environment }}`' >> $GITHUB_STEP_SUMMARY

      - name: Notify failure on Slack
        uses: slackapi/slack-github-action@v3
        if: failure()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NOTIF }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "danger"
                fallback: "Setup ${{ inputs.product }}-${{ inputs.environment }} a échoué"
                title: "Setup ${{ inputs.product }}-${{ inputs.environment }} a échoué"
                title_link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                text: "<!channel> *[${{ inputs.product }}-${{ inputs.environment }}]* *${{ github.workflow }}* failed!\n\nYou can get error logs using :\n\n`.bin/infra app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.product }}-${{ inputs.environment }}`"
                fields:
                  - title: ""
                    value: ""
                  - title: "Branch"
                    value: "<${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}|${{ github.ref_name }}>"
                  - title: "Commit"
                    value: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                footer: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"

      - name: Notify success on Slack
        uses: slackapi/slack-github-action@v3
        if: success()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NOTIF }}
          webhook-type: incoming-webhook
          payload: |
            text: "Setup ${{ inputs.product }}-${{ inputs.environment }} terminé avec succès"
            attachments:
              - color: "good"
                fields:
                  - title: "Branch"
                    value: "<${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}|${{ github.ref_name }}>"
                  - title: "Commit"
                    value: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                footer: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
