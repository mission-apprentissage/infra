name: Scheduled All Servers Reboot
on:
  schedule:
    - cron: '0 20 * * *'

jobs:
  reboot_servers:
    strategy:
      fail-fast: false
      matrix:
        # matomo : à ajouter une fois le serveur provisionné (vars/secrets matomo_SSH_KNOWN_HOSTS et
        # matomo_OPENPGP_PRIVATE_SUBKEY créés), sinon les étapes SSH et GPG échouent avec des valeurs vides.
        product:
          [
            "api",
            "bal",
            "data",
            "lba",
            "monitoring",
            "sentry",
            "tdb",
            "vpn",
          ]
        environment:
          [
            "production",
            "recette",
            "preview",
            "preprod",
          ]
        exclude:
          - product: "api"
            environment: "production"
          - product: "bal"
            environment: "production"
          - product: "lba"
            environment: "production"
          # conservé pour que matomo-production reste hors du reboot planifié le jour où le produit rejoint la matrice
          - product: "matomo"
            environment: "production"
          - product: "tdb"
            environment: "production"
    name: Reboot ${{ matrix.product }}-${{ matrix.environment }}
    uses: "./.github/workflows/_reboot.yml"
    with:
      product: "${{ matrix.product }}"
      environment: "${{ matrix.environment }}"
      SSH_KNOWN_HOSTS: ${{ vars[format('{0}_SSH_KNOWN_HOSTS', matrix.product)] }}
    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}
      SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
      SLACK_WEBHOOK_NOTIF: ${{ secrets.SLACK_WEBHOOK_NOTIF }}
      OVH_APP_TOKEN: ${{ secrets.OVH_APP_TOKEN }}
      OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
      OVH_APP_SECRET: ${{ secrets.OVH_APP_SECRET }}
      INFRA_OPENPGP_PRIVATE_SUBKEY: ${{ secrets.INFRA_OPENPGP_PRIVATE_SUBKEY }}
  reboot_mongodb:
    strategy:
      fail-fast: false
      matrix:
        cluster: ['api', 'bal', 'lba', 'recette', 'tdb']
    name: Cluster Reboot ${{ matrix.cluster }}
    uses: "./.github/workflows/cluster-reboot.yml"
    with:
      cluster: ${{ matrix.cluster }}
      numbers: '[3, 2, 1]'
    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_PASS: ${{ secrets.DEPLOY_PASS }}
      SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
      SLACK_WEBHOOK_NOTIF: ${{ secrets.SLACK_WEBHOOK_NOTIF }}
      OVH_APP_TOKEN: ${{ secrets.OVH_APP_TOKEN }}
      OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
      OVH_APP_SECRET: ${{ secrets.OVH_APP_SECRET }}
      INFRA_OPENPGP_PRIVATE_SUBKEY: ${{ secrets.INFRA_OPENPGP_PRIVATE_SUBKEY }}
