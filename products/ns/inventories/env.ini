[all:vars]
product_name=ns
# Nginx
modsec_body_limit=1073741824
modsec_rule_engine=DetectionOnly

[ns1]
ns1.ssh.mna.internal
[ns1:vars]
host_name=ns1
env_type=base
host_dns_name={{ host_name }}.mna.internal
certbot=False
private=True
manual_nftables=True
vlan=30
private_ip=10.20.30.231
private_ssh_ip=10.20.35.231

[ns2]
ns2.ssh.mna.internal
[ns2:vars]
host_name=ns2
env_type=base
host_dns_name={{ host_name }}.mna.internal
certbot=False
private=True
manual_nftables=True
vlan=30
private_ip=10.20.30.232
private_ssh_ip=10.20.35.232
