[all:vars]
product_name=matomo
domain_name=matomo
repo=mission-apprentissage/matomo
# Nginx
# Corps de requête max côté ModSecurity : imports Matomo (API bulk tracking, upload de plugins) < 20 Mo.
modsec_body_limit=20971520
# Démarrage en détection seule : le tracker (paramètres url=, urlref=), l'UI (token_auth, segment)
# et le MCP (JSON-RPC) déclenchent des faux positifs OWASP CRS à qualifier via modsec_audit.log
# avant de repasser en mode bloquant (retirer la ligne = valeur par défaut "On").
modsec_rule_engine=DetectionOnly

[production]
# TODO : remplacer par l'adresse IPv4 du VPS OVH (8 vCPU / 32 Go / NVMe) dès sa livraison.
# 192.0.2.1 est une adresse de documentation (RFC 5737), volontairement non routable.
192.0.2.1
[production:vars]
env_type=production
host_name={{ product_name }}-production
dns_name={{ domain_name }}.apprentissage.beta.gouv.fr
