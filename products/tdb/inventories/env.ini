[all:vars]
app_version=latest
product_name=tdb
repo=mission-apprentissage/flux-retour-cfas
database_name=tdb
# Nginx
modsec_body_limit=115353600
modsec_rule_engine=DetectionOnly

[production]
tdb.production.ssh.mna.internal
[production:vars]
env_type=production
host_name={{ product_name }}.{{ env_type }}
dns_name=cfas.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=120
private_ip=10.20.120.41
private_ssh_ip=10.20.125.41
disallow_robots=False
add_kernel_modification=False

[preprod]
tdb.preprod.ssh.mna.internal
[preprod:vars]
env_type=preprod
host_name={{ product_name }}.{{ env_type }}
dns_name=cfas-{{ env_type }}.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=130
private_ip=10.20.130.41
private_ssh_ip=10.20.135.41
disallow_robots=True

[staging]
tdb.staging.ssh.mna.internal
[staging:vars]
env_type=staging
host_name={{ product_name }}.{{ env_type }}
dns_name=cfas-recette.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=140
private_ip=10.20.140.41
private_ssh_ip=10.20.145.41
disallow_robots=True

[local]
localhost ansible_host=127.0.0.1 ansible_connection=local
[local:vars]
env_type=local
