[all:vars]
product_name=b
# Nginx
modsec_body_limit=1073741824
modsec_rule_engine=DetectionOnly

[b1]
b1.ssh.mna.internal
[b1:vars]
host_name=b1
env_type=base
host_dns_name={{ host_name }}.mna.internal
certbot=False
private=True
manual_nftables=True
vlan=20
private_ip=10.20.20.241
private_ssh_ip=10.20.25.241

[b2]
b2.ssh.mna.internal
[b2:vars]
host_name=b2
env_type=base
host_dns_name={{ host_name }}.mna.internal
certbot=False
private=True
manual_nftables=True
vlan=20
private_ip=10.20.20.242
private_ssh_ip=10.20.25.242
