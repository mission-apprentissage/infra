[all:vars]
product_name=afw
# Nginx
modsec_body_limit=1073741824
modsec_rule_engine=DetectionOnly

[afw1]
afw1.ssh.mna.internal
[afw1:vars]
host_name=afw1
env_type=base
host_dns_name={{ host_name }}.mna.internal
certbot=False
private=True
manual_nftables=True
vlan=10
private_ip=10.20.10.251
private_ssh_ip=10.20.15.251

[afw2]
afw2.ssh.mna.internal
[afw2:vars]
host_name=afw2
env_type=base
host_dns_name={{ host_name }}.mna.internal
certbot=False
private=True
manual_nftables=True
vlan=10
private_ip=10.20.10.252
private_ssh_ip=10.20.15.252
