[all:vars]
app_version=latest
product_name=lba
repo=mission-apprentissage/labonnealternance
database_name=lba
# Nginx
modsec_body_limit=5243904

[production]
lba.production.ssh.mna.internal
[production:vars]
env_type=production
host_name={{ product_name }}.{{ env_type }}
dns_name=labonnealternance.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=120
private_ip=10.20.120.11
private_ssh_ip=10.20.125.11
disallow_robots=false

[staging]
lba.staging.ssh.mna.internal
[staging:vars]
env_type=staging
dns_name=labonnealternance-recette.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=140
private_ip=10.20.140.11
private_ssh_ip=10.20.145.11
app_version=recette

[preview]
lba.preview.ssh.mna.internal
[preview:vars]
host_name={{ product_name }}.preview
env_type=preview
dns_name=labonnealternance-preview.apprentissage.beta.gouv.fr
alias_dns_name={{ product_name }}-preview.apprentissage.beta.gouv.fr
docker_dedicated_disk=True
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=150
private_ip=10.20.150.11
private_ssh_ip=10.20.155.11

[local]
localhost ansible_host=127.0.0.1 ansible_connection=local
[local:vars]
env_type=local
