[all:vars]
product_name=analytics
domain_name=analytics
repo=mission-apprentissage/analytics
# Nginx
modsec_body_limit=20971520
# Démarrage en détection seule : le tracker (paramètres url=, urlref=), l'UI (token_auth, segment)
# et le MCP (JSON-RPC) déclenchent des faux positifs OWASP CRS à qualifier via modsec_audit.log
# avant de repasser en mode bloquant (retirer la ligne = valeur par défaut "On").
modsec_rule_engine=DetectionOnly

[base]
analytics.mna.internal
[base:vars]
env_type=production
host_name={{ product_name }}-production
dns_name={{ domain_name }}.apprentissage.beta.gouv.fr
