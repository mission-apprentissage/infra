[all:vars]
product_name=api
repo=mission-apprentissage/api-apprentissage
app_version=latest
database_name=api
# Nginx
modsec_body_limit=5243904

[production]
api.production.ssh.mna.internal
[production:vars]
env_type=production
host_name={{ product_name }}.{{ env_type }}
dns_name={{ product_name }}.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=120
private_ip=10.20.120.21
private_ssh_ip=10.20.125.21
disallow_robots=false

[staging]
api.staging.ssh.mna.internal
[staging:vars]
env_type=staging
host_name={{ product_name }}.{{ env_type }}
dns_name={{ product_name }}-recette.apprentissage.beta.gouv.fr
host_dns_name={{ product_name }}.{{ env_type }}.mna.internal
certbot=False
private=True
vlan=140
private_ip=10.20.140.21
private_ssh_ip=10.20.145.21
app_version=recette

[local]
localhost ansible_host=127.0.0.1 ansible_connection=local
[local:vars]
env_type=local
